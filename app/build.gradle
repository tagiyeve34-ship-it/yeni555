plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Firebase (google-services.json) hələ əlavə olunmayıbsa belə build sınmasın deyə şərti tətbiq
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.ailenezareti.panelapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.ailenezareti.kompas"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"


        // ============================================================
        // BURANI DƏYİŞİN: server API-nizin əsas ünvanı (sonunda / OLMADAN)
        // ============================================================
        buildConfigField "String", "API_BASE_URL", "\"https://hesabat.site/usaq/webpanel/api\""
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Pulsuz OpenStreetMap xəritəsi - API key və billing tələb etmir
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    // Firebase Cloud Messaging — ani push bildirişlər üçün
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging-ktx'
}
